<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivícia - Charme que Transforma</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="main-header">
        <div class="header-container">
            <img src="Logo - Vivi.png" class="logo-img">
            <div class="header-text-brand">
                <h1 class="brand-title">Vivícia</h1>
                <p class="brand-slogan">Charme que transforma</p>
                <p class="brand-subtitle">Encontre seus produtos favoritos</p>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container">
        
        <!-- SEÇÃO DE FILTROS E BUSCA -->
        <section class="filter-section">
            <div class="search-box-wrapper">
                <input type="text" id="search-input" placeholder="🔍 Buscar por nome do produto..." autocomplete="off">
                <button id="btn-clear-search" class="btn-clear" style="display: none;">✕</button>
            </div>

            <div class="brand-filter-wrapper" id="brand-filters">
                <!-- Os botões de marca serão gerados automaticamente via JS -->
            </div>

            <div class="results-info">
                <span id="results-count">Mostrando produtos...</span>
            </div>
        </section>

        <!-- GRID DE PRODUTOS -->
        <section class="products-section">
            <div class="product-grid" id="product-grid">
                <!-- Produtos renderizados via JS -->
            </div>
            <div id="no-products-msg" class="no-products" style="display: none;">
                <p>Nenhum produto encontrado para essa busca. 🙁</p>
            </div>
        </section>

    </main>

    <!-- BARRA FIXA INFERIOR DE CHECKOUT -->
    <div class="cart-bar">
        <div class="cart-bar-container">
            <div class="cart-info" id="cart-info-trigger" style="cursor: pointer;">
                <div class="cart-icon-wrapper">
                    🛒 <span class="cart-badge" id="cart-count">0</span>
                </div>
                <div class="cart-total-text">
                    <span>Total (clique p/ ver):</span>
                    <strong id="cart-total-value">R$ 0,00</strong>
                </div>
            </div>
            <button class="btn-checkout-whatsapp" id="btn-whatsapp">
                Confirmar via WhatsApp
            </button>
        </div>
    </div>

    <!-- MODAL DO CARRINHO -->
    <div class="cart-modal-overlay" id="cart-modal">
        <div class="cart-modal-content">
            <div class="cart-modal-header">
                <h2>Seu Carrinho 🛍️</h2>
                <button class="close-modal-btn" id="close-modal">&times;</button>
            </div>
            <div class="cart-modal-body" id="cart-items-container">
                <!-- Renderizado via JS -->
            </div>
            <div class="cart-modal-footer">
                <div class="modal-total-wrapper">
                    <span>Valor Total:</span>
                    <strong id="modal-total-value">R$ 0,00</strong>
                </div>
                <button class="btn-checkout-whatsapp" id="btn-whatsapp-modal">
                    Finalizar via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- RODAPÉ -->
    <footer class="main-footer">
        <div class="container">
            <p>Sobre Nós | Dúvidas | Seguir @ViviciaOficial</p>
        </div>
    </footer>

    <script src="script.js" charset="UTF-8"></script>
</body>
</html>
