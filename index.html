<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivícia - Catálogo e Loja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <div class="header-container">
            <h1 class="logo">Vivícia</h1>
            <div class="header-actions">
                <button id="btn-open-tracking" class="btn-secondary">📦 Rastrear Pedido</button>
                <button id="cart-info-trigger" class="btn-cart">
                    🛒 Carrinho (<span id="cart-count">0</span>) - <span id="cart-total-value">R$ 0,00</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <!-- Barra de Filtros e Pesquisa -->
        <section class="filter-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar por produto...">
            </div>
            <div class="filter-box">
                <select id="brand-filter">
                    <option value="">Todas as Marcas</option>
                </select>
            </div>
        </section>

        <!-- Grade de Produtos -->
        <section id="product-grid" class="product-grid">
            <!-- Produtos inseridos via JS -->
        </section>
    </main>

    <!-- Modal do Carrinho -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Seu Carrinho</h2>
                <button id="close-modal" class="close-btn">&times;</button>
            </div>
            <div id="cart-items-container" class="cart-items-container">
                <p class="cart-empty-text">Seu carrinho está vazio.</p>
            </div>
            <div class="modal-footer">
                <div class="cart-summary">
                    <span>Total:</span>
                    <strong id="modal-total-value">R$ 0,00</strong>
                </div>
                <button id="btn-whatsapp-modal" class="btn-whatsapp">Finalizar via WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- Modal de Rastreio de Pedido -->
    <div id="tracking-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Rastreamento de Pedido</h2>
                <button id="close-tracking-modal" class="close-btn">&times;</button>
            </div>
            <div class="tracking-search">
                <input type="text" id="tracking-code-input" placeholder="Digite o código (ex: VV-1234)">
                <button id="btn-search-tracking" class="btn-primary">Consultar</button>
            </div>
            <div id="tracking-result" class="tracking-result">
                <!-- Linha do tempo inserida via JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
