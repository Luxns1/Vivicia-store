<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivícia - Charme que Transforma</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="main-header">
        <div class="header-container">
            <img src="Logo - Vivi.png" alt="Vivícia Logo" class="logo-img">
            <div class="header-text-brand">
                <h1 class="brand-title">Vivícia</h1>
                <p class="brand-slogan">Charme que transforma</p>
                <p class="brand-subtitle">Aqui você encontra os melhores produtos</p>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container">
        <section class="products-section">
            <h2 class="section-title">Nossos Produtos</h2>
            <div class="product-grid" id="product-grid">
                <!-- Produtos renderizados via JavaScript através do produtos.csv -->
            </div>
        </section>
    </main>

    <!-- BARRA FIXA INFERIOR DE CHECKOUT -->
    <div class="cart-bar">
        <div class="cart-bar-container">
            <div class="cart-info" id="cart-info-trigger" style="cursor: pointer;">
                <div class="cart-icon-wrapper">
                    🛒 <span class="cart-badge" id="cart-count">0</span>
                </div>
                <div class="cart-total-text">
                    <span>Total (clique p/ ver):</span>
                    <strong id="cart-total-value">R$ 0,00</strong>
                </div>
            </div>
            <button class="btn-checkout-whatsapp" id="btn-whatsapp">
                Confirmar via WhatsApp
            </button>
        </div>
    </div>

    <!-- MODAL DO CARRINHO (JANELA FLUTUANTE DE DETALHES) -->
    <div class="cart-modal-overlay" id="cart-modal">
        <div class="cart-modal-content">
            <div class="cart-modal-header">
                <h2>Seu Carrinho 🛍️</h2>
                <button class="close-modal-btn" id="close-modal">&times;</button>
            </div>
            <div class="cart-modal-body" id="cart-items-container">
                <!-- Itens do carrinho renderizados via JavaScript -->
            </div>
            <div class="cart-modal-footer">
                <div class="modal-total-wrapper">
                    <span>Valor Total:</span>
                    <strong id="modal-total-value">R$ 0,00</strong>
                </div>
                <button class="btn-checkout-whatsapp" id="btn-whatsapp-modal">
                    Finalizar via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- RODAPÉ -->
    <footer class="main-footer">
        <div class="container">
            <p>Sobre Nós | Dúvidas | Seguir @ViviciaOficial</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
